<!doctype html><html lang="tr"><meta charset="utf-8"><title>Video Downloader</title><style>*{box-sizing:border-box}body{font:14px system-ui;width:520px;max-height:590px;overflow:auto;margin:0;padding:15px;background:#f4f5f7;color:#20252e}header{display:flex;justify-content:space-between;align-items:center}h2{margin:0 0 12px}button,select,input{font:inherit}button{cursor:pointer}#url{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:9px 0}.card{display:flex;align-items:center;gap:12px;background:white;border:1px solid #ddd;border-radius:11px;padding:10px;margin:10px 0;box-shadow:0 2px 4px #0001}.thumb{width:125px;height:75px;object-fit:cover;border-radius:7px}.body{flex:1;min-width:0}.title{font-weight:600;margin-bottom:9px;overflow-wrap:anywhere}.controls{display:flex;gap:8px;flex-wrap:wrap}select{max-width:190px;padding:8px;border:1px solid #ccc;border-radius:7px;background:#fafafa}.download{background:#008bd2;color:white;border:0;border-radius:8px;padding:9px 13px}.download:disabled{opacity:.45}.remove{align-self:start;border:0;background:transparent;font-size:22px;color:#667085}.message{font-size:12px;color:#667085;margin-top:6px;overflow-wrap:anywhere}#clear{border:1px solid #ccc;background:white;border-radius:7px;padding:7px}#status{color:#ad3434} .tabs{display:flex;gap:8px;margin:10px 0}.tabs button{padding:8px 14px;border:1px solid #ddd;border-radius:7px;background:white}.tabs .active{background:#008bd2;color:white}.playlist-row{display:flex;gap:8px;align-items:center;background:white;border-radius:8px;padding:8px;margin:5px 0}.playlist-row img{width:65px}.playlist-row .name{flex:1;min-width:0;overflow-wrap:anywhere}.playlist-row select{max-width:115px}.playlist-row .item-download{white-space:nowrap}.playlist-row.failed{border:1px solid #e55;background:#fff0f0}.playlist-row.done{border-left:3px solid #28a745}.item-error{font-size:11px;color:#b42318;overflow-wrap:anywhere}.playlist-row .name{display:flex;flex-direction:column}#playlist-url{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.hidden{display:none}#playlist-message{white-space:pre-wrap;overflow-wrap:anywhere}</style><header><h2>Video Downloader</h2><button id="clear">Listeyi temizle</button></header><nav class="tabs"><button id="tab-videos" class="active">Videolar</button><button id="tab-playlists">Oynatma listeleri</button></nav><section id="video-panel"><input id="url" placeholder="YouTube bağlantısı yapıştırın ve Enter'a basın"><div id="videos"></div><p id="status" role="status"></p></section><section id="playlist-panel" class="hidden"><input id="playlist-url" placeholder="YouTube oynatma listesi bağlantısı"><button id="playlist-load">Listeyi getir</button><h3 id="playlist-title"></h3><div class="toolbar"><button id="playlist-all">Tümünü seç</button><button id="playlist-none">Seçimi kaldır</button><select id="playlist-format"><option value="mp3-192">MP3 192 kbps</option><option value="mp3-128">MP3 128 kbps</option><option value="mp3-320">MP3 320 kbps</option><option value="m4a">M4A</option><option value="best-mp4">MP4 en iyi</option><option value="mp4-1080">MP4 1080p</option><option value="mp4-720">MP4 720p</option><option value="best-webm">WebM en iyi</option><option value="best-mkv">MKV en iyi</option></select><button id="playlist-apply">Hepsine uygula</button></div><div id="playlist-items"></div><button class="download" id="playlist-download">Seçilenleri indir</button><button id="playlist-retry" class="hidden">Hatalıları tekrar indir</button><button id="playlist-cancel" class="hidden">İndirmeyi iptal et</button><progress id="playlist-progress" max="100" value="0" style="width:100%"></progress><p id="playlist-message" role="status"></p></section><script src="popup.js"></script><script src="playlist.js"></script></html>
