<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Video Downloader</title><style>body{font:14px system-ui;width:350px;padding:16px;background:#101827;color:#f8fafc}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:7px 0;border-radius:8px;border:1px solid #475569;background:#1e293b;color:white}button{background:#2563eb;border:0;cursor:pointer}button:disabled{opacity:.5}small{color:#cbd5e1}#status{white-space:pre-wrap;overflow-wrap:anywhere}</style><h2>Video Downloader</h2><label>Video bağlantısı<input id="url" placeholder="https://www.youtube.com/watch?v=..."></label><button id="inspect">Formatları getir</button><label>Format<select id="format"><option value="">Önce video seçin</option></select></label><button id="download" disabled>İndir</button><p id="status" role="status"></p><small>Yerel yardımcı uygulama açık olmalı. Yalnızca indirme izniniz olan içerikler için kullanın.</small><script src="popup.js"></script></html>
