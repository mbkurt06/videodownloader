<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Video Downloader</title><style>body{font:14px system-ui;width:360px;max-height:560px;overflow:auto;padding:16px;background:#101827;color:#f8fafc}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:7px 0;border-radius:8px;border:1px solid #475569;background:#1e293b;color:white}button{background:#2563eb;border:0;cursor:pointer}button:disabled{opacity:.5}small{color:#cbd5e1}#status{white-space:pre-wrap;overflow-wrap:anywhere}#videos{max-height:180px;overflow:auto}.video{display:block;text-align:left;background:#1e293b;margin:5px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.video.active{outline:2px solid #60a5fa}</style><h2>Video Downloader</h2><label>Video bağlantısı<input id="url" placeholder="YouTube bağlantısı"></label><h3>İzlenen videolar</h3><div id="videos"></div><button id="clear">Listeyi temizle</button><button id="inspect">Formatları getir</button><label>Format<select id="format"><option value="">Önce video seçin</option></select></label><button id="download" disabled>İndir</button><p id="status" role="status"></p><small>Video geçmişi yalnızca bu tarayıcıda saklanır. İndirme için yerel servis açık olmalı.</small><script src="popup.js"></script></html>
