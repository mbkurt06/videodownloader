<!doctype html><html lang="tr"><meta charset="utf-8"><title>Video Downloader</title><style>*{box-sizing:border-box}body{font:14px system-ui;width:520px;max-height:590px;overflow:auto;margin:0;padding:15px;background:#f4f5f7;color:#20252e}header{display:flex;justify-content:space-between;align-items:center}h2{margin:0 0 12px}button,select,input{font:inherit}button{cursor:pointer}#url{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:9px 0}.card{display:flex;align-items:center;gap:12px;background:white;border:1px solid #ddd;border-radius:11px;padding:10px;margin:10px 0;box-shadow:0 2px 4px #0001}.thumb{width:125px;height:75px;object-fit:cover;border-radius:7px}.body{flex:1;min-width:0}.title{font-weight:600;margin-bottom:9px;overflow-wrap:anywhere}.controls{display:flex;gap:8px;flex-wrap:wrap}select{max-width:190px;padding:8px;border:1px solid #ccc;border-radius:7px;background:#fafafa}.download{background:#008bd2;color:white;border:0;border-radius:8px;padding:9px 13px}.download:disabled{opacity:.45}.remove{align-self:start;border:0;background:transparent;font-size:22px;color:#667085}.message{font-size:12px;color:#667085;margin-top:6px;overflow-wrap:anywhere}#clear{border:1px solid #ccc;background:white;border-radius:7px;padding:7px}#status{color:#ad3434}</style><header><h2>Video Downloader</h2><button id="clear">Listeyi temizle</button></header><input id="url" placeholder="YouTube bağlantısı yapıştırın ve Enter'a basın"><div id="videos"></div><p id="status" role="status"></p><script src="popup.js"></script></html>
